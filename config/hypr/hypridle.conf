general {
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
}

# 300秒(5分)後に画面をロック（bar の sleep time 初期値と一致させる。
# config/eww/scripts/dpms-timeout が実際の値でこのファイルを書き換える）
listener {
    timeout = 300
    on-timeout = hyprlock
    on-resume = hyprctl dispatch dpms on
}

# ロックされてから300秒(5分)後に画面をオフにする
listener {
    timeout = 600
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}