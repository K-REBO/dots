# ── デザイントークン ──────────────────────────────────────────
# 配色・角丸・フォントは config/quickshell/Theme.qml の値と統一。
# ログイン画面 (ly, hosts/nixos/configuration.nix) も同じ値を参照している。

background {
    color = rgba(7, 7, 14, 1.0)
}

# パネル
shape {
    size = 420, 220
    rounding = 12
    color = rgba(15, 15, 36, 0.96)
    border_size = 1
    border_color = rgba(255, 255, 255, 0.12)
    position = 0, 0
    halign = center
    valign = center
}

# 時刻
label {
    text = cmd[update:1000] echo "$(date '+%H:%M')"
    color = rgba(221, 227, 255, 1.0)
    font_size = 36
    font_family = JetBrainsMono Nerd Font
    position = 0, 56
    halign = center
    valign = center
}

# 日付
label {
    text = cmd[update:60000] echo "$(date '+%Y-%m-%d (%a)')"
    color = rgba(104, 112, 160, 1.0)
    font_size = 16
    font_family = JetBrainsMono Nerd Font
    position = 0, 24
    halign = center
    valign = center
}

# ログインユーザー
label {
    text = cmd[update:0] printf "login: %s" "$USER"
    color = rgba(104, 112, 160, 1.0)
    font_size = 16
    font_family = JetBrainsMono Nerd Font
    position = 0, -16
    halign = center
    valign = center
}

# パスワード入力
input-field {
    size = 280, 44
    outline_thickness = 2
    dots_size = 0.3
    dots_spacing = 0.35
    dots_center = true
    outer_color = rgba(77, 184, 255, 0.6)
    inner_color = rgba(26, 28, 46, 0.90)
    font_color = rgba(221, 227, 255, 1.0)
    font_family = JetBrainsMono Nerd Font
    font_size = 18
    fade_on_empty = false
    placeholder_text = パスワードを入力...
    hide_input = false
    rounding = 8
    position = 0, -60
    halign = center
    valign = center
    check_color = rgba(0, 229, 170, 1.0)
    fail_color = rgba(255, 85, 119, 1.0)
    fail_text = 認証に失敗しました ($ATTEMPTS)
    fail_transition = 200
    capslock_color = rgba(255, 204, 85, 1.0)
}
